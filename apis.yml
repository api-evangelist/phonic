name: Phonic
description: >-
  Phonic is a San Francisco voice AI company (founded 2024, seed-backed by Lux Capital) building
  the first end-to-end speech-to-speech platform for reliable conversational voice agents. The
  Phonic API lets developers create and configure voice agents, attach voices, place and receive
  inbound/outbound phone calls (including via SIP trunking and Amazon Connect), run real-time
  speech-to-speech conversations over a WebSocket, wire up webhook/WebSocket/context/transfer/MCP
  tools, and analyze, evaluate, and extract structured data from conversations. It ships an OpenAPI
  3.1 REST spec, an AsyncAPI 2.6.0 WebSocket spec, official Node and Python SDKs, a hosted MCP
  server, and llms.txt docs for AI clients.
