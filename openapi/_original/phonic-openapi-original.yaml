          type: string
          description: Instructions for the conversation.
        template_variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentTemplateVariables'
          description: Template variables that the agent can use in the welcome message and the system prompt.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AgentToolsItems'
          description: List of tools available to the agent.
        built_in_tool_configs:
          $ref: '#/components/schemas/BuiltInToolConfigs'
          description: Configuration overrides for built-in tools, keyed by built-in tool ID.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          description: Tasks for the agent to complete during the conversation.
