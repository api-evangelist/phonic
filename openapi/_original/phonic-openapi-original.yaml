openapi: 3.1.0
info:
  title: API Reference
  version: 1.0.0
paths:
  /agents:
    get:
      operationId: list
      summary: List
      description: Returns all agents in a project.
      tags:
        - agents
      parameters:
        - name: project
          in: query
          description: The name of the project to list agents for.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_list_Response_200'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    post:
      operationId: create
      summary: Create
      description: Creates a new agent in a project.
      tags:
        - agents
      parameters:
        - name: project
          in: query
          description: The name of the project to create the agent in.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_create_Response_201'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized (authentication missing or invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
  /agents/upsert:
    put:
      operationId: upsert
      summary: Upsert
      description: >-
        Upserts an agent by name. If an agent with the same name already exists, it will be updated. Otherwise, it will
        be created.
      tags:
        - agents
      parameters:
        - name: project
          in: query
          description: The name of the project containing the agent.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_upsert_Response_200'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAgentRequest'
  /agents/{nameOrId}:
    get:
      operationId: get
      summary: Get
      description: Returns an agent by name or ID.
      tags:
        - agents
      parameters:
        - name: nameOrId
          in: path
          description: The name or the ID of the agent to get.
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: The name of the project containing the agent. Only used when `nameOrId` is a name.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_get_Response_200'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    delete:
      operationId: delete
      summary: Delete
      description: Deletes an agent by name or ID.
      tags:
        - agents
      parameters:
        - name: nameOrId
          in: path
          description: The name or the ID of the agent to delete.
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: The name of the project containing the agent. Only used when `nameOrId` is a name.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_delete_Response_200'
        '403':
          description: Forbidden (resource belongs to a different organization)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
    patch:
      operationId: update
      summary: Update
      description: Updates an agent by name or ID.
      tags:
        - agents
      parameters:
        - name: nameOrId
          in: path
          description: The name or the ID of the agent to update.
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: The name of the project containing the agent. Only used when `nameOrId` is a name.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_update_Response_200'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Agent not found
          content:
            application/json:
