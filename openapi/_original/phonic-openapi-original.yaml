          type: number
          format: double
          default: 0.1
          description: How aggressively the assistant backchannels, from 0 to 1.
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/AgentIntegration'
          description: Third-party integrations enabled for the agent.
