          type: string
          description: The timezone of the agent. Used to format system variables like `{{system_time}}`.
        voice_id:
          type: string
          description: The voice ID of the agent.
        audio_format:
          $ref: '#/components/schemas/AgentAudioFormat'
          description: The audio format of the agent. If the agent has a phone number, the audio format will be `mulaw_8000`.
        audio_speed:
          type: number
          format: double
          description: The audio speed of the agent. Must be a multiple of 0.1.
        background_noise_level:
          type: number
          format: double
          description: The background noise level of the agent. Must be between 0 and 1.
        background_noise:
          $ref: '#/components/schemas/AgentBackgroundNoise'
          description: The background noise type. Can be "office", "call-center", "coffee-shop", or null.
        generate_welcome_message:
          type: boolean
          description: >-
            When `true`, the welcome message will be automatically generated and the `welcome_message` field will be
            ignored.
        is_welcome_message_interruptible:
          type: boolean
          description: When `false`, the welcome message will not be interruptible by the user.
        websocket_timeout_sec:
          type: integer
          default: 60
          description: Number of seconds of inactivity before the conversation WebSocket is closed.
        welcome_message:
          type:
            - string
            - 'null'
          description: Message to play when the conversation starts. Ignored when `generate_welcome_message` is `true`.
