    OutboundCallConfigMultilingualMode:
      type: string
      enum:
        - auto
        - request
        - initial
      default: request
      description: >-
        If `"auto"`, each user audio is automatically identified for the language to respond in. If `"request"`, user
        must request to change language (recommended). If `"initial"` the first turn user audio determines the language
        for the rest of the conversation.
      title: OutboundCallConfigMultilingualMode
    OutboundCallConfigIntelligenceLevel:
      type: string
      enum:
        - standard
        - high
      default: standard
      description: >-
        The intelligence level of the agent. `high` uses a more capable model for more complex reasoning, while
        `standard` is optimized for lower latency.
      title: OutboundCallConfigIntelligenceLevel
    OutboundCallConfigPronunciationDictionaryItems:
      type: object
      properties:
        word:
          type: string
        pronunciation:
          type: string
      required:
        - word
        - pronunciation
      title: OutboundCallConfigPronunciationDictionaryItems
    OutboundCallConfigToolsItems0:
      type: string
      enum:
        - keypad_input
        - natural_conversation_ending
      description: Built-in tool
      title: OutboundCallConfigToolsItems0
    OutboundCallConfigToolsItems:
      oneOf:
        - $ref: '#/components/schemas/OutboundCallConfigToolsItems0'
        - type: string
      title: OutboundCallConfigToolsItems
    OutboundCallConfigModel:
      type: string
      enum:
        - merritt
      default: merritt
      description: The speech-to-speech model to use.
      title: OutboundCallConfigModel
    OutboundCallConfigBackgroundNoise:
      type: string
      enum:
        - office
        - call-center
        - coffee-shop
      description: The background noise type. Can be "office", "call-center", "coffee-shop", or null.
      title: OutboundCallConfigBackgroundNoise
    OutboundCallConfigConfigurationEndpoint:
      type: object
      properties:
        url:
          type: string
          description: URL to call
        headers:
          type: object
          additionalProperties:
            type: string
          description: Object of key-value pairs.
        timeout_ms:
          type: integer
          default: 3000
          description: Timeout in milliseconds for the endpoint call.
      required:
        - url
      description: >-
        When not `null`, at the beginning of the conversation the agent will make a POST request to this endpoint to get
        configuration options.
      title: OutboundCallConfigConfigurationEndpoint
    OutboundCallConfig:
      type: object
      properties:
        agent:
          type: string
          description: The name of the agent to use for the call.
        project:
          type: string
          default: main
          description: The name of the project to use for the call.
        generate_welcome_message:
          type: boolean
          default: false
          description: >-
            When `true`, the welcome message will be automatically generated and the `welcome_message` field will be
            ignored.
        is_welcome_message_interruptible:
          type: boolean
          default: true
          description: When `false`, the welcome message will not be interruptible by the user.
        welcome_message:
          type:
            - string
            - 'null'
          description: >-
            Message to play when the conversation starts. Can contain template variables like `{{customer_name}}`.
            Ignored when `generate_welcome_message` is `true`.
        system_prompt:
          type: string
          default: Respond in 1-2 sentences.
          description: Instructions for the conversation. Can contain template variables like `{{subject}}`.
        template_variables:
          type: object
          additionalProperties:
            type: string
          description: Variables that can be used in the welcome message and the system prompt.
        voice_id:
          type: string
          default: sabrina
          description: The voice ID to use for the agent.
        generate_no_input_poke_text:
          type: boolean
          default: false
          description: Whether to have the no-input poke text be generated by AI.
        no_input_poke_sec:
          type:
            - integer
            - 'null'
          description: Number of seconds of silence before sending a poke message. `null` disables the poke message.
        no_input_poke_text:
          type: string
          default: Are you still there?
          description: The message to send after the specified silence. Ignored when generate_no_input_poke_text is true.
        no_input_end_conversation_sec:
          type: integer
          default: 180
          description: Seconds of silence before ending the conversation.
        default_language:
          $ref: '#/components/schemas/LanguageCode'
          description: >-
            ISO 639-1 language code that sets the agent's default language to recognize and speak. Welcome message and
            no input poke text should be in this language.
        additional_languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'
          default: []
          description: >-
            Array of additional ISO 639-1 language codes that the agent should be able to recognize and speak. Should
            not include `default_language`. When `multilingual_mode` is `"auto"`, a maximum of 2 additional languages is
            allowed.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'
          default:
            - en
          description: >-
            Array of ISO 639-1 language codes that the agent should be able to recognize. This field is deprecated. Use
            `default_language` and `additional_languages` instead.
        multilingual_mode:
          $ref: '#/components/schemas/OutboundCallConfigMultilingualMode'
          default: request
          description: >-
            If `"auto"`, each user audio is automatically identified for the language to respond in. If `"request"`,
            user must request to change language (recommended). If `"initial"` the first turn user audio determines the
            language for the rest of the conversation.
        push_to_talk:
          type: boolean
          default: false
          description: Push to talk mode. User must send mute/unmute messages to turn on/off listening to audio. Defaults to false.
        intelligence_level:
          $ref: '#/components/schemas/OutboundCallConfigIntelligenceLevel'
          default: standard
          description: >-
            The intelligence level of the agent. `high` uses a more capable model for more complex reasoning, while
            `standard` is optimized for lower latency.
        boosted_keywords:
          type: array
          items:
            type: string
          description: These words, or short phrases, will be more accurately recognized by the agent.
        pronunciation_dictionary:
          type: array
          items:
            $ref: '#/components/schemas/OutboundCallConfigPronunciationDictionaryItems'
          description: Array of `{ word, pronunciation }` entries. Words must be unique.
        min_words_to_interrupt:
          type: integer
          default: 1
          description: Minimum number of words required to interrupt the assistant.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/OutboundCallConfigToolsItems'
          description: Array of built-in or custom tool names to use.
        enable_redaction:
          type: boolean
          default: false
          description: >-
            When `true`, PII and PHI are redacted from text transcripts (e.g. replaced with tags like `[PHONE NUMBER]`)
            and bleeped from audio recordings after the conversation ends.
        model:
          $ref: '#/components/schemas/OutboundCallConfigModel'
          default: merritt
          description: The speech-to-speech model to use.
        audio_speed:
          type: number
          format: double
          default: 1
          description: The audio speed of the agent.
        background_noise:
          $ref: '#/components/schemas/OutboundCallConfigBackgroundNoise'
          description: The background noise type. Can be "office", "call-center", "coffee-shop", or null.
        background_noise_level:
          type: number
          format: double
          default: 0
          description: The background noise level of the agent.
        mcp_servers:
          type: array
          items:
            type: string
          description: Array of MCP server names to use.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          description: Array of task objects with `name` and `description` fields.
        outbound_number_pool:
          oneOf:
            - $ref: '#/components/schemas/OutboundNumberPool'
            - type: 'null'
          description: Pool of phone numbers used for outbound calls.
        enable_assistant_backchannel:
          type: boolean
          default: false
          description: When `true`, the assistant will produce backchannel responses (e.g. "mm-hmm") while the user is speaking.
        assistant_backchannel_aggressiveness:
          type: number
          format: double
          default: 0.1
          description: >-
            How aggressively the assistant produces backchannel responses. Only relevant when
            `enable_assistant_backchannel` is `true`.
        configuration_endpoint:
          oneOf:
            - $ref: '#/components/schemas/OutboundCallConfigConfigurationEndpoint'
            - type: 'null'
          description: >-
            When not `null`, at the beginning of the conversation the agent will make a POST request to this endpoint to
            get configuration options.
        additional_params:
          type: object
          additionalProperties:
            description: Any type
          description: Additional runtime parameters.
        data_retention_policy:
          $ref: '#/components/schemas/DataRetentionPolicy'
          description: Controls how long transcripts and audio recordings are retained before deletion.
      description: When an `agent` is provided, these `config` options override the agent settings.
      title: OutboundCallConfig
    OutboundCallRequest:
      type: object
