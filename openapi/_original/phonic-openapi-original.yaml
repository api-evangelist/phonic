            before calling the tool ("required"), the model decides ("optional"), or the agent must stay silent
            ("suppressed"). Not used by other tool types.
        wait_for_speech_before_tool_call:
          type: boolean
          default: false
          description: >-
            If true, the agent will wait to finish speaking before executing the tool. This is only available for
            custom_webhook and custom_websocket tools.
        forbid_speech_after_tool_call:
          type: boolean
          default: false
          description: >-
            When true, forbids the agent from speaking after executing the tool. Available for custom_context,
            custom_webhook and custom_websocket tools.
        allow_tool_chaining:
          type: boolean
          default: true
          description: >-
            When true, allows the agent to chain and execute other tools after executing the tool. Available for
            custom_context, custom_webhook and custom_websocket tools.
        wait_for_response:
          type: boolean
          default: false
          description: >-
            The agent doesn't typically wait for the response of async custom_websocket tools. When true, makes the
            agent wait for a response, not call other tools and inform the user of the result. Only available for async
            custom_websocket tools.
        context:
          type: string
          description: The static context returned to the agent. Only present for custom_context tools.
