  /agents/{nameOrId}/custom-phone-numbers:
    post:
      operationId: add-custom-phone-number
      summary: Add Custom Phone Number
      description: Adds a custom phone number to an agent. The user must configure their SIP trunk to point to Phonic's SIP server.
      tags:
        - agents
      parameters:
        - name: nameOrId
          in: path
          description: The name or the ID of the agent.
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: The name of the project containing the agent. Only used when `nameOrId` is a name.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
        - name: X-Sip-Address
          in: header
          description: >-
            SIP address of the user's SIP trunk. Optional, but if provided, all three SIP headers (X-Sip-Address,
            X-Sip-Auth-Username, X-Sip-Auth-Password) must be provided. When these headers are provided, call transfers
            from the agent will use the provided SIP details.
          required: false
          schema:
            type: string
        - name: X-Sip-Auth-Username
          in: header
          description: >-
            SIP auth username. Optional, but if provided, all three SIP headers (X-Sip-Address, X-Sip-Auth-Username,
            X-Sip-Auth-Password) must be provided. When these headers are provided, call transfers from the agent will
            use the provided SIP details.
          required: false
          schema:
            type: string
        - name: X-Sip-Auth-Password
          in: header
          description: >-
            SIP auth password. Optional, but if provided, all three SIP headers (X-Sip-Address, X-Sip-Auth-Username,
            X-Sip-Auth-Password) must be provided. When these headers are provided, call transfers from the agent will
            use the provided SIP details.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_add_custom_phone_number_Response_200'
        '400':
          description: Invalid parameters or phone number already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '401':
          description: Unsupported authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: The agent is currently being updated. Please try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_number:
                  type: string
                  description: The E.164 formatted phone number to add (e.g., "+15551234567").
                configuration_endpoint:
                  oneOf:
                    - $ref: >-
                        #/components/schemas/AgentsNameOrIdCustomPhoneNumbersPostRequestBodyContentApplicationJsonSchemaConfigurationEndpoint
                    - type: 'null'
                  description: >-
                    When not `null`, the agent will call this endpoint to get configuration options for calls on this
                    phone number.
              required:
                - phone_number
    delete:
      operationId: delete-custom-phone-number
      summary: Delete Custom Phone Number
      description: Deletes a custom phone number from an agent.
      tags:
        - agents
      parameters:
        - name: nameOrId
          in: path
          description: The name or the ID of the agent.
          required: true
          schema:
            type: string
        - name: project
          in: query
          description: The name of the project containing the agent. Only used when `nameOrId` is a name.
          required: false
          schema:
            type: string
            default: main
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents_delete_custom_phone_number_Response_200'
        '400':
          description: Invalid parameters, phone number not assigned to agent, or not a custom phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '401':
          description: Unsupported authentication method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Agent or phone number not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: The agent is currently being updated. Please try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_number:
                  type: string
                  description: The E.164 formatted phone number to remove (e.g., "+15551234567").
              required:
                - phone_number
