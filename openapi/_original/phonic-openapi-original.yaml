          type: boolean
          default: false
          description: Whether to have the no-input poke text be generated by AI.
        no_input_poke_sec:
          type:
            - integer
            - 'null'
          description: Number of seconds of silence before sending a poke message. `null` disables the poke message.
        no_input_poke_text:
          type: string
          description: The message to send after the specified silence. Ignored when generate_no_input_poke_text is true.
        no_input_end_conversation_sec:
          type: integer
          description: Seconds of silence before ending the conversation.
        default_language:
          $ref: '#/components/schemas/LanguageCode'
          description: >-
            ISO 639-1 language code that sets the agent's default language to recognize and speak. Welcome message and
            no input poke text should be in this language.
        additional_languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'
          description: >-
            Array of additional ISO 639-1 language codes that the agent should be able to recognize and speak. Should
            not include `default_language`. When `multilingual_mode` is `"auto"`, a maximum of 2 additional languages is
            allowed.
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageCode'
          default:
            - en
          description: >-
            Array of ISO 639-1 language codes that the agent should be able to recognize. This field is deprecated. Use
            `default_language` and `additional_languages` instead.
        multilingual_mode:
          $ref: '#/components/schemas/AgentMultilingualMode'
          description: >-
            If `"auto"`, each user audio is automatically identified for the language to respond in. If `"request"`,
            user must request to change language (recommended). If `"initial"` the first turn user audio determines the
            language for the rest of the conversation.
        push_to_talk:
          type: boolean
          default: false
          description: Push to talk mode. User must send mute/unmute messages to turn on/off listening to audio. Defaults to false.
        intelligence_level:
          $ref: '#/components/schemas/AgentIntelligenceLevel'
          description: >-
            The intelligence level of the agent. `high` uses a more capable model for more complex reasoning, while
            `standard` is optimized for lower latency.
        boosted_keywords:
          type: array
          items:
            type: string
          description: These words, or short phrases, will be more accurately recognized by the agent.
        observability_integrations:
          type: array
          items:
            $ref: '#/components/schemas/AgentObservabilityIntegrationsItems'
          description: Names of observability integrations enabled for the agent. Each must be one of the supported providers.
        pronunciation_dictionary:
          type: array
          items:
            $ref: '#/components/schemas/AgentPronunciationDictionaryItems'
          description: Array of `{ word, pronunciation }` entries. Words must be unique.
        min_words_to_interrupt:
          type: integer
          default: 1
          description: Minimum number of words required to interrupt the assistant.
        configuration_endpoint:
          oneOf:
            - $ref: '#/components/schemas/AgentConfigurationEndpoint'
            - type: 'null'
          description: When not `null`, the agent will call this endpoint to get configuration options.
        inbound_rollout:
          type: number
          format: double
          description: >-
            Float between 0.0 and 1.0 representing the percentage of inbound calls handled by Agent. Requires
            `phone_number` to be set when less than 1.0.
