servers:
  - url: https://api.phonic.ai/v1
    description: https://api.phonic.ai/v1
components:
  schemas:
    AgentProject:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      description: The project the agent belongs to.
      title: AgentProject
    AgentAudioFormat:
      type: string
      enum:
        - pcm_44100
        - pcm_24000
        - pcm_16000
        - pcm_8000
        - mulaw_8000
      description: The audio format of the agent. If the agent has a phone number, the audio format will be `mulaw_8000`.
      title: AgentAudioFormat
    AgentBackgroundNoise:
      type: string
      enum:
        - office
        - call-center
        - coffee-shop
      description: The background noise type. Can be "office", "call-center", "coffee-shop", or null.
      title: AgentBackgroundNoise
    AgentTemplateVariables:
      type: object
      properties:
        default_value:
          type:
            - string
            - 'null'
      required:
        - default_value
      title: AgentTemplateVariables
    AgentToolsItems0:
      type: string
      enum:
        - keypad_input
        - natural_conversation_ending
      description: Built-in tool
      title: AgentToolsItems0
    AgentToolsItems:
      oneOf:
        - $ref: '#/components/schemas/AgentToolsItems0'
        - type: string
      title: AgentToolsItems
