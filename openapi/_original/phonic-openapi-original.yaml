    get:
      operationId: list
      summary: List
      description: Returns conversations with optional filtering.
      tags:
        - conversations
      parameters:
        - name: project
          in: query
          description: The name of the project to list conversations for.
          required: false
          schema:
            type: string
            default: main
        - name: external_id
          in: query
          description: Filter by external ID to get a specific conversation.
          required: false
          schema:
            type: string
        - name: duration_min
          in: query
          description: Minimum duration in seconds.
          required: false
          schema:
            type: integer
        - name: duration_max
          in: query
          description: Maximum duration in seconds.
          required: false
          schema:
            type: integer
        - name: started_at_min
          in: query
          description: 'Minimum start date/time. Valid examples: `2025-04-17`, `2025-04-17T02:48:52.708Z`'
          required: false
          schema:
            type: string
        - name: started_at_max
          in: query
          description: 'Maximum start date/time. Valid examples: `2025-04-17`, `2025-04-17T02:48:52.708Z`'
          required: false
          schema:
            type: string
        - name: before
          in: query
          description: >-
            Cursor for backward pagination. Use a conversation ID from `pagination.prev_cursor` to fetch the previous
            page of conversations. Cannot be used with `after`.
          required: false
          schema:
            type: string
        - name: after
          in: query
          description: >-
            Cursor for forward pagination. Use a conversation ID from `pagination.next_cursor` to fetch the next page of
            conversations. Cannot be used with `before`.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of conversations to return per page.
          required: false
          schema:
            type: integer
            default: 20
        - name: audio_container
          in: query
          description: Format of the presigned `audio_url` in each conversation in the response.
          required: false
          schema:
            $ref: '#/components/schemas/ConversationsGetParametersAudioContainer'
            default: wav.gz
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            Paginated list (`conversations`, `pagination`) when listing, or a single `conversation` when the
            `external_id` query parameter matches exactly one conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversations_list_Response_200'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized (authentication missing or invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Project or conversation not found
