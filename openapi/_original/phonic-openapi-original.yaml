          type:
            - string
            - 'null'
          description: >-
            The E.164 formatted phone number to transfer calls to. Set to null if the agent should determine the phone
            number.
        dtmf:
          type:
            - string
            - 'null'
          description: >-
            DTMF digits to send after the transfer connects (e.g., "1234"). Defaults to null. Ignored when dynamic_dtmf
            is true.
        dynamic_dtmf:
          type: boolean
          default: false
          description: >-
            When true, the agent determines the DTMF digits at call time (and may choose to send none); the static dtmf
            is ignored. Only sent when use_agent_phone_number is true (not on a SIP REFER transfer).
        use_agent_phone_number:
          type: boolean
          default: true
          description: >-
            When true, Phonic will transfer the call using the agent's phone number. When false, Phonic will transfer
            the call using the phone number of the party to whom the agent is connected. This is only available for
            built_in_transfer_to_phone_number tools.
        detect_voicemail:
          type: boolean
          default: false
          description: >-
            When true, Phonic will listen in and tell the user if the transfer hits voicemail. This is only available
            for built_in_transfer_to_phone_number tools when use_agent_phone_number is true.
        agents_to_transfer_to:
          type: array
          items:
            type: string
          description: >-
            Array of agent names that the LLM can choose from when transferring. Required for built_in_transfer_to_agent
            tools.
