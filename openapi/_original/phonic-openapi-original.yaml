  /conversations/sip/outbound_call:
    post:
      operationId: sip-outbound-call
      summary: Sip Outbound Call
      description: Initiates a SIP outbound call using user-supplied SIP credentials in headers.
      tags:
        - conversations
      parameters:
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
        - name: X-Sip-Address
          in: header
          description: SIP address of the user's SIP trunk. Required.
          required: true
          schema:
            type: string
        - name: X-Sip-Auth-Username
          in: header
          description: SIP auth username, if your provider requires it.
          required: false
          schema:
            type: string
        - name: X-Sip-Auth-Password
          in: header
          description: SIP auth password, if your provider requires it.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversations_sip_outbound_call_Response_200'
        '400':
          description: Invalid query parameters or body, or missing required headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostConversationsSipOutboundCallRequestBadRequestError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: >-
            The SIP call could not be completed. The `sip_status_code` and `sip_status` fields contain the carrier's SIP
            response details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SipCallError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from_phone_number:
                  type: string
                  description: Caller ID phone number in E.164 format.
                to_phone_number:
                  type: string
                  description: Destination phone number in E.164 format.
                config:
                  $ref: '#/components/schemas/OutboundCallConfig'
                dry_run:
                  type: boolean
                  default: false
                  description: >-
                    If true, validates the outbound call setup without placing a call. Returns HTTP 200 with
                    `conversation_id` and `twilio_call_sid` set to null.
              required:
                - from_phone_number
                - to_phone_number
  /conversations/{id}/replay:
    post:
      operationId: replay
      summary: Replay
      description: |
        Replays an ended conversation by re-running its recorded audio through an
        agent. Requires API key or access token authentication. The conversation must
        have audio recordings available and an associated agent (or one specified in
        the request body).
      tags:
        - conversations
      parameters:
        - name: id
          in: path
          description: The ID of the conversation to replay.
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          description: >-
            Bearer authentication header of the form `Bearer <PHONIC_API_KEY>`. Manage your API keys
            [here](https://phonic.co/api-keys).
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Replay started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/conversations_replay_Response_200'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized (authentication missing or invalid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '409':
          description: Cannot replay an active conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '422':
          description: Conversation cannot be replayed (no audio, deleted recordings, or no agent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '429':
          description: Concurrency limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
        '503':
          description: Insufficient capacity available to start the replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayConversationRequest'
