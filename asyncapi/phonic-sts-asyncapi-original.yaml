            ISO 639-1 language code that sets the agent's default language to recognize and speak. Welcome message and
            no input poke text should be in this language.
        additional_languages:
          type: array
          items:
            type: string
          default: []
          description: >-
            Array of additional ISO 639-1 language codes that the agent should be able to recognize and speak. Should
            not include `default_language`. When `multilingual_mode` is `"auto"`, a maximum of 2 additional languages is
            allowed.
        multilingual_mode:
          $ref: '#/components/schemas/ChannelsStsMessagesConfigMultilingualMode'
          default: request
          description: >-
            If `"auto"`, each user audio is automatically identified for the language to respond in. If `"request"`,
            user must request to change language (recommended). If `"initial"` the first turn user audio determines the
            language for the rest of the conversation.
        push_to_talk:
          type: boolean
          default: false
          description: Push to talk mode. User must send mute/unmute messages to turn on/off listening to audio. Defaults to false.
        stream_ahead_of_real_time:
          type: boolean
          default: false
          description: >-
            When `true`, assistant audio is streamed to the client as fast as it is generated, rather than paced to real
            time. Defaults to false.
        intelligence_level:
          $ref: '#/components/schemas/ChannelsStsMessagesConfigIntelligenceLevel'
          default: standard
          description: >-
            The intelligence level of the agent. `high` uses a more capable model for more complex reasoning, while
            `standard` is optimized for lower latency.
