          type: array
          items:
            $ref: '#/components/schemas/ToolDefinition'
          description: >-
            Tools available to the assistant. Use a string to reference a pre-defined tool by name, provide a built-in
            tool object to override its default configuration, or define an inline WebSocket tool for this conversation.
        template_variables:
          type: object
          additionalProperties:
            type: string
          description: Template variables for system prompt and welcome message
        enable_redaction:
          type: boolean
          default: false
          description: >-
            When `true`, PII and PHI are redacted from text transcripts (e.g. replaced with tags like `[PHONE NUMBER]`)
            and bleeped from audio recordings after the conversation ends.
        mcp_servers:
          type: array
          items:
            type: string
          default: []
          description: Names of pre-configured MCP servers to make available to the assistant. Names must be unique.
        observability_integrations:
          type: array
          items:
            $ref: '#/components/schemas/ChannelsStsMessagesConfigObservabilityIntegrationsItems'
