            $ref: '#/components/schemas/ToolDefinition'
          description: >-
            Tools available to the assistant. Use a string to reference a pre-defined tool by name, provide a built-in
            tool object to override its default configuration, or define an inline WebSocket tool for this conversation.
        template_variables:
          type: object
          additionalProperties:
            type: string
          description: Template variables for system prompt and welcome message
        enable_redaction:
          type: boolean
          default: false
          description: >-
            When `true`, PII and PHI are redacted from text transcripts (e.g. replaced with tags like `[PHONE NUMBER]`)
            and bleeped from audio recordings after the conversation ends.
        mcp_servers:
          type: array
          items:
            type: string
          default: []
          description: Names of pre-configured MCP servers to make available to the assistant. Names must be unique.
        observability_integrations:
          type: array
          items:
            $ref: '#/components/schemas/ConfigOptionsObservabilityIntegrationsItems'
          default: []
          description: >-
            Names of observability integrations to enable for the conversation. Each must be one of the supported
            providers.
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ConfigOptionsTasksItems'
          description: Tasks the assistant should accomplish during the conversation.
        outbound_number_pool:
          oneOf:
            - $ref: '#/components/schemas/ConfigOptionsOutboundNumberPool'
            - type: 'null'
          description: Pool of phone numbers to use as the caller ID for outbound calls.
        enable_assistant_backchannel:
          type: boolean
          default: false
          description: >-
            When `true`, the assistant will produce backchannel responses (e.g. "mm-hmm", "yeah") while the user is
            speaking.
        assistant_backchannel_aggressiveness:
          type: number
          format: double
          default: 0.1
          description: >-
            How aggressively the assistant produces backchannel responses. Only applies when
            `enable_assistant_backchannel` is `true`.
        configuration_endpoint:
          oneOf:
            - $ref: '#/components/schemas/ConfigOptionsConfigurationEndpoint'
            - type: 'null'
          description: When not `null`, the agent will call this endpoint to get configuration options for the conversation.
        additional_params:
          type: object
          additionalProperties:
            description: Any type
          description: Additional runtime parameters.
        data_retention_policy:
          $ref: '#/components/schemas/ConfigOptionsDataRetentionPolicy'
          description: |
            Policy controlling how long transcripts and audio recordings are retained before being deleted.
            When `zero_data_retention` is `true`, nothing is retained and `transcripts`/`audio_recordings` are omitted.
      description: |
        Configuration fields for the initial `config` message.
      title: ConfigOptions
    sts_reset:
      type: object
      properties:
        type:
          type: string
          enum:
            - reset
        config:
          $ref: '#/components/schemas/ConfigOptions'
      required:
        - type
        - config
      title: sts_reset
